<!doctype html><html><head><meta charset='utf-8'><title>AgentReady Viewer</title><style>body{font-family:Arial;margin:24px} .card{border:1px solid #ccc;padding:12px;margin-bottom:12px} .fail{background:#fee} .pass{background:#efe}</style></head><body><h1>AgentReady</h1><p id='thesis'></p><div id='cards'></div><pre id='compare'></pre><script>
fetch('report-data.json').then(r=>r.json()).then(d=>{document.getElementById('thesis').textContent=d.thesis;const c=document.getElementById('cards');[['v1 weak docs',d.fail],['v2 agent-ready docs',d.pass]].forEach(([n,r])=>{const el=document.createElement('div');el.className='card '+(r.overallResult==='pass'?'pass':'fail');el.innerHTML=`<h3>${n}: ${r.overallResult.toUpperCase()}</h3><p>Observed Failures: ${(r.observedFailures||[]).join('; ')||'None'}</p><p>Likely AX causes: ${(r.likelyAXCauses||[]).join('; ')||'None'}</p><p>Recommended fixes: ${(r.recommendedFixes||[]).join('; ')||'None'}</p>`;c.appendChild(el);});document.getElementById('compare').textContent=JSON.stringify({before:d.fail.scorecard,after:d.pass.scorecard},null,2);});
</script></body></html>
